<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Md Shadi Rohan, Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c0d27"/>
      <stop offset="0.6" stop-color="#170714"/>
      <stop offset="1" stop-color="#0f040d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.88" cy="1.1" r="0.7">
      <stop offset="0" stop-color="#E95420" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E95420" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.05" cy="-0.2" r="0.6">
      <stop offset="0" stop-color="#7a2266" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7a2266" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <linearGradient id="hex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#c2185b"/>
    </linearGradient>
    <clipPath id="r"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
      .sans { font-family: "Ubuntu", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1s steps(1) infinite; }
      .pulse { animation: pulse 2s ease-out infinite; transform-origin: 81px 252px; }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
      @keyframes float { 50% { transform: translateY(-8px); } }
      @media (prefers-reduced-motion: reduce) { .cursor, .pulse, .float { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#r)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect width="1200" height="320" fill="url(#glow2)"/>

    <!-- window chrome -->
    <rect x="0" y="0" width="1200" height="34" fill="#000" fill-opacity="0.35"/>
    <circle cx="22" cy="17" r="5.5" fill="#E95420"/>
    <circle cx="42" cy="17" r="5.5" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="62" cy="17" r="5.5" fill="#ffffff" fill-opacity="0.25"/>
    <text x="600" y="22" text-anchor="middle" class="mono" font-size="13" fill="#ffffff" fill-opacity="0.55">rohan@github: ~</text>

    <!-- prompt -->
    <text x="64" y="86" class="mono" font-size="20" xml:space="preserve"><tspan fill="#8ae234" font-weight="700">rohan@github</tspan><tspan fill="#fff">:</tspan><tspan fill="#729fcf" font-weight="700">~</tspan><tspan fill="#fff">$ whoami --pretty </tspan><tspan fill="#fff" class="cursor">▍</tspan></text>

    <!-- name -->
    <text x="62" y="160" class="sans" font-size="60" font-weight="700" fill="#ffffff" letter-spacing="-1">Md Shadi Rohan</text>
    <text x="64" y="205" class="sans" xml:space="preserve"><tspan font-size="27" font-weight="500" fill="#ff8a3d">Software Engineer</tspan><tspan font-size="22" fill="#ffffff" fill-opacity="0.72">  ·  Full-stack · Next.js · Node.js · TypeScript · AWS</tspan></text>

    <!-- status -->
    <circle cx="81" cy="252" r="6" fill="#3fb950" class="pulse"/>
    <circle cx="81" cy="252" r="6" fill="#3fb950"/>
    <text x="98" y="258" class="sans" font-size="18" fill="#ffffff" fill-opacity="0.85">Open to new opportunities  ·  Dhaka, Bangladesh</text>

    <!-- logo -->
    <g class="float">
      <g transform="translate(948 78) scale(3.4)">
        <path d="M24 3l18 10.4v21.2L24 45 6 34.6V13.4z" fill="url(#hex)"/>
        <path d="M15 31V17h6.5a4.3 4.3 0 010 8.6H15m6.5 0L26 31" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M29.5 31h5" stroke="#fff" stroke-width="3" stroke-linecap="round" class="cursor"/>
      </g>
    </g>
  </g>
</svg>
